name: Release

# Nowe wydanie (tag vX.Y.Z) powstaje automatycznie, gdy na main zmieni się "version" w manifest.json.
on:
  push:
    branches: [main]
    paths: ['custom_components/reqnet/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "ver=$(jq -r .version custom_components/reqnet/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Skip if release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.ver }}" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Publish
        if: steps.exists.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.ver }}" --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.ver }}" --generate-notes
